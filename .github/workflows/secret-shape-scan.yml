name: Secret-shape scan

# T-570: scans the tracked files under handoff/ and .claude/ for secret shapes (AWS key ids,
# Mongo URIs with credentials, rzp_ keys, JWTs, long hex, sk-ant-, ghp_, xox*-, private key
# headers). Prints file:line and the pattern name only, never a value; fails on any hit.
# Its own workflow because ci.yml skips pushes that touch only handoff/** and .claude/** (T-249),
# which are exactly the paths this scans; its own concurrency group, so it never cancels a CI run.
# No install step: plain node, no dependencies. Does not depend on gitleaks.
on:
  push:
    # Arjun's ruling (26 Oct 2026): develop_staging, develop, main and the release branch pattern.
    # No release branch pattern is defined yet (T-533 cuts main by workflow); release/** is assumed.
    branches: [main, develop, develop_staging, 'release/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop, develop_staging]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    name: Secret-shape scan (handoff/, .claude/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/secret-shape-scan.mjs
