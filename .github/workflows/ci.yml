name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @lawie/shared build

      - name: Lint Gateway
        run: yarn workspace @lawie/gateway lint

      - name: Lint Auth
        run: yarn workspace @lawie/auth lint

      - name: Lint Drafting
        run: yarn workspace @lawie/drafting lint

      - name: Lint Billing
        run: yarn workspace @lawie/billing lint

      - name: Lint Web
        run: yarn workspace @lawie/web lint

  # ── Test Gateway ────────────────────────────────────────────────────────────
  test-gateway:
    name: Test — Gateway
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @lawie/shared build

      - name: Run Gateway tests
        run: yarn workspace @lawie/gateway test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: gateway
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Auth ───────────────────────────────────────────────────────────────
  test-auth:
    name: Test — Auth
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @lawie/shared build

      - name: Run Auth tests
        run: yarn workspace @lawie/auth test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: auth
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Drafting ───────────────────────────────────────────────────────────
  test-drafting:
    name: Test — Drafting
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @lawie/shared build

      - name: Run Drafting tests
        run: yarn workspace @lawie/drafting test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: drafting
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Billing ────────────────────────────────────────────────────────────
  test-billing:
    name: Test — Billing
    runs-on: ubuntu-latest
    needs: lint

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared package
        run: yarn workspace @lawie/shared build

      - name: Run Billing tests
        run: yarn workspace @lawie/billing test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: billing
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Build ────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-gateway, test-auth, test-drafting, test-billing]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to AWS ECR
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: aws-actions/amazon-ecr-login@v2
        with:
          aws-region: ${{ secrets.AWS_REGION }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Build Gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/gateway/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ secrets.ECR_REGISTRY }}/lawie-gateway:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/lawie-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Auth image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/auth/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ secrets.ECR_REGISTRY }}/lawie-auth:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/lawie-auth:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Drafting image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/drafting/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ secrets.ECR_REGISTRY }}/lawie-drafting:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/lawie-drafting:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Billing image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/billing/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ secrets.ECR_REGISTRY }}/lawie-billing:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/lawie-billing:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          target: production
          push: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}
          tags: |
            ${{ secrets.ECR_REGISTRY }}/lawie-web:${{ github.sha }}
            ${{ secrets.ECR_REGISTRY }}/lawie-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
