name: CI — Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Detect which services changed ───────────────────────────────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      auth: ${{ steps.filter.outputs.auth }}
      drafting: ${{ steps.filter.outputs.drafting }}
      billing: ${{ steps.filter.outputs.billing }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            gateway:
              - 'apps/gateway/**'
            auth:
              - 'apps/auth/**'
            drafting:
              - 'apps/drafting/**'
            billing:
              - 'apps/billing/**'
            shared:
              - 'packages/shared/**'
              - 'package.json'
              - 'yarn.lock'
              - 'tsconfig*.json'
              - 'jest.config.base.js'
              - '.github/workflows/ci.yml'

  # ── Test Gateway ─────────────────────────────────────────────────────────
  test-gateway:
    name: Test — Gateway
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.shared == 'true'
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @lawie/shared build
      - run: yarn workspace @lawie/gateway test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: gateway
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Auth ────────────────────────────────────────────────────────────
  test-auth:
    name: Test — Auth
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.auth == 'true' || needs.changes.outputs.shared == 'true'
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @lawie/shared build
      - run: yarn workspace @lawie/auth test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: auth
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Drafting ────────────────────────────────────────────────────────
  test-drafting:
    name: Test — Drafting
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.drafting == 'true' || needs.changes.outputs.shared == 'true'
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @lawie/shared build
      - run: yarn workspace @lawie/drafting test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: drafting
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Test Billing ─────────────────────────────────────────────────────────
  test-billing:
    name: Test — Billing
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.billing == 'true' || needs.changes.outputs.shared == 'true'
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @lawie/shared build
      - run: yarn workspace @lawie/billing test
      - uses: codecov/codecov-action@v4
        if: always()
        with:
          flags: billing
          token: ${{ secrets.CODECOV_TOKEN }}
