version: '3.9'

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: lawie_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: lawie
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lawie_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Gateway Service ─────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: builder
    container_name: lawie_gateway
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_SERVICE_URL: http://auth:4001
      DRAFTING_SERVICE_URL: http://drafting:4002
      BILLING_SERVICE_URL: http://billing:4003
    ports:
      - '4000:4000'
    volumes:
      - ./apps/gateway/src:/app/apps/gateway/src
    depends_on:
      - auth
      - drafting
      - billing
    networks:
      - lawie_net
    command: yarn workspace @lawie/gateway dev

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: builder
    container_name: lawie_auth
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
    ports:
      - '4001:4001'
    volumes:
      - ./apps/auth/src:/app/apps/auth/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - lawie_net
    command: yarn workspace @lawie/auth dev

  # ── Drafting Service ────────────────────────────────────────────────────────
  drafting:
    build:
      context: .
      dockerfile: apps/drafting/Dockerfile
      target: builder
    container_name: lawie_drafting
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4002
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
    ports:
      - '4002:4002'
    volumes:
      - ./apps/drafting/src:/app/apps/drafting/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - lawie_net
    command: yarn workspace @lawie/drafting dev

  # ── Billing Service ─────────────────────────────────────────────────────────
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
      target: builder
    container_name: lawie_billing
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: 4003
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
    ports:
      - '4003:4003'
    volumes:
      - ./apps/billing/src:/app/apps/billing/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - lawie_net
    command: yarn workspace @lawie/billing dev

  # ── Web (Next.js) ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    container_name: lawie_web
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      - gateway
    networks:
      - lawie_net
    command: yarn workspace @lawie/web dev

  # ── Mongo Express (Dev DB UI) ───────────────────────────────────────────────
  mongo-express:
    image: mongo-express:1.0.2
    container_name: lawie_mongo_ui
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASS:-changeme}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/
      ME_CONFIG_BASICAUTH: 'false'
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - lawie_net
    profiles:
      - dev-tools

volumes:
  mongo_data:

networks:
  lawie_net:
    driver: bridge
