version: '3.9'

# Uses MongoDB Atlas + Redis Cloud from .env.development.
# No local Mongo or Redis containers — connect to cloud directly.

services:
  # ── Gateway ────────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
      target: production
    container_name: lawie_gateway
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      PORT: 4000
      AUTH_SERVICE_URL: http://auth:4001
      DRAFTING_SERVICE_URL: http://drafting:4002
      BILLING_SERVICE_URL: http://billing:4003
      REDIS_URL: redis://host.docker.internal:6379
    ports:
      - '4000:4000'
    depends_on:
      - auth
      - drafting
      - billing
    networks:
      - lawie_net

  # ── Auth ───────────────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
      target: production
    container_name: lawie_auth
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      PORT: 4001
      MONGO_URI: mongodb://host.docker.internal:27017/lawie
      REDIS_URL: redis://host.docker.internal:6379
    ports:
      - '4001:4001'
    networks:
      - lawie_net

  # ── Drafting ───────────────────────────────────────────────────────────────
  drafting:
    build:
      context: .
      dockerfile: apps/drafting/Dockerfile
      target: production
    container_name: lawie_drafting
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      PORT: 4002
      MONGO_URI: mongodb://host.docker.internal:27017/lawie
      REDIS_URL: redis://host.docker.internal:6379
    ports:
      - '4002:4002'
    networks:
      - lawie_net

  # ── Billing ────────────────────────────────────────────────────────────────
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
      target: production
    container_name: lawie_billing
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      PORT: 4003
      MONGO_URI: mongodb://host.docker.internal:27017/lawie
      REDIS_URL: redis://host.docker.internal:6379
    ports:
      - '4003:4003'
    networks:
      - lawie_net

  # ── Web (Next.js) ──────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: lawie_web
    restart: unless-stopped
    env_file: .env.development
    environment:
      NODE_ENV: development
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - gateway
    networks:
      - lawie_net

networks:
  lawie_net:
    driver: bridge
