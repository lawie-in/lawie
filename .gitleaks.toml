# Gitleaks config — scans staged diffs for secrets before every commit.
# Ships with a solid default ruleset; we extend it with Lawie-specific rules.

[extend]
useDefault = true

# ── Project-specific rules ────────────────────────────────────────────────────
[[rules]]
id = "lawie-jwt-secret"
description = "Lawie JWT secret env var with a real value"
regex = '''(?i)(jwt_secret|jwt_refresh_secret)\s*=\s*['"]?[A-Za-z0-9+/=]{32,}['"]?'''
tags = ["secret", "lawie"]

[[rules]]
id = "lawie-mongo-uri-with-password"
description = "MongoDB connection string containing a password"
regex = '''mongodb(?:\+srv)?:\/\/[^:]+:[^@]{6,}@'''
tags = ["secret", "database"]

[[rules]]
id = "lawie-secret-shell-default"
description = "Real secret used as a shell default, e.g. ${INTERNAL_SECRET:-<value>} (T-117)"
regex = '''\$\{[A-Z0-9_]*(?:SECRET|TOKEN|KEY|PASSWORD)[A-Z0-9_]*:-[A-Za-z0-9+/=_-]{16,}\}'''
tags = ["secret", "lawie"]

[[rules]]
id = "lawie-internal-secret"
description = "INTERNAL_SECRET with a real value"
regex = '''(?i)internal_secret\s*[=:]\s*['"]?[A-Za-z0-9+/=_-]{32,}['"]?'''
tags = ["secret", "lawie"]

# ── Allowlist (things that look like secrets but aren't) ──────────────────────
[allowlist]
description = "Known-safe files and placeholders"
paths = [
  '''\.env\.example''',
  '''\.env\.staging\.example''',
  '''\.env\.production\.example''',
  '''\.env\.development''',
  '''docker-compose\.yml''',
  '''docker/mongo/init\.js''',
  '''docs/.*\.md''',
]
regexes = [
  '''CHANGE_ME''',
  '''your-super-secret-.*-change-in-production''',
  '''dev-jwt-.*-not-for-production''',
  '''changeme''',
  '''REPLACE_ME''',
  # Dev-only all-zeros ENCRYPTION_KEY placeholder (zero entropy — safe)
  '''^0{64}$''',
]
