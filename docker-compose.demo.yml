# Demo compose — single EC2 t3.micro (2 vCPU, 1GB RAM)
# Everything runs on the box: Mongo, Redis, Nginx, 4 services.
# Builds from source — no ECR needed.
#
# Setup: docs/demo-deploy.md
# Run:   docker compose -f docker-compose.demo.yml up -d --build

services:
  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: lawie_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-changeme}
      MONGO_INITDB_DATABASE: lawie
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: lawie_redis
    restart: unless-stopped
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M

  # ── Nginx — SSL termination + routing ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lawie_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.demo.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - lawie_demo
    deploy:
      resources:
        limits:
          memory: 32M

  # ── Gateway Service ────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    container_name: lawie_gateway
    restart: unless-stopped
    env_file: .env.demo
    environment:
      NODE_ENV: production
      PORT: 4000
      AUTH_SERVICE_URL: http://auth:4001
      DRAFTING_SERVICE_URL: http://drafting:4002
      BILLING_SERVICE_URL: http://billing:4003
      REDIS_URL: redis://redis:6379
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Auth Service ───────────────────────────────────────────────────────────
  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: lawie_auth
    restart: unless-stopped
    env_file: .env.demo
    environment:
      NODE_ENV: production
      PORT: 4001
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
      REDIS_URL: redis://redis:6379
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ── Drafting Service ───────────────────────────────────────────────────────
  drafting:
    build:
      context: .
      dockerfile: apps/drafting/Dockerfile
    container_name: lawie_drafting
    restart: unless-stopped
    env_file: .env.demo
    environment:
      NODE_ENV: production
      PORT: 4002
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
      REDIS_URL: redis://redis:6379
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4002/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  # ── Billing Service ────────────────────────────────────────────────────────
  billing:
    build:
      context: .
      dockerfile: apps/billing/Dockerfile
    container_name: lawie_billing
    restart: unless-stopped
    env_file: .env.demo
    environment:
      NODE_ENV: production
      PORT: 4003
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASS:-changeme}@mongo:27017/lawie?authSource=admin
    networks:
      - lawie_demo
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4003/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      mongo:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  mongo_data:
  redis_data:

networks:
  lawie_demo:
    driver: bridge
