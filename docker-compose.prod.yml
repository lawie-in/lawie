version: '3.9'

# Production compose — single EC2 (t3.medium), ap-south-1
# Images pulled from ECR. Nginx handles SSL + path-based routing.
# Env vars written to .env.production by CI/CD from AWS Secrets Manager (never committed).
# Run: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d

services:
  # ── Nginx — SSL termination + routing ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lawie_nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt certs — obtained on EC2 host via certbot, mounted read-only
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Certbot webroot for renewals
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - gateway
      - auth
      - drafting
      - billing
    networks:
      - lawie_prod

  # ── Gateway Service ─────────────────────────────────────────────────────────
  gateway:
    image: ${ECR_REGISTRY}/lawie-prod-gateway:stable
    container_name: lawie_gateway
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth:3001
      DRAFTING_SERVICE_URL: http://drafting:3002
      BILLING_SERVICE_URL: http://billing:3003
    networks:
      - lawie_prod
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Auth Service ─────────────────────────────────────────────────────────────
  auth:
    image: ${ECR_REGISTRY}/lawie-prod-auth:stable
    container_name: lawie_auth
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - lawie_prod
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Drafting Service ─────────────────────────────────────────────────────────
  drafting:
    image: ${ECR_REGISTRY}/lawie-prod-drafting:stable
    container_name: lawie_drafting
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3002
    networks:
      - lawie_prod
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3002/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Billing Service ──────────────────────────────────────────────────────────
  billing:
    image: ${ECR_REGISTRY}/lawie-prod-billing:stable
    container_name: lawie_billing
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3003
    networks:
      - lawie_prod
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3003/health']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  lawie_prod:
    driver: bridge
