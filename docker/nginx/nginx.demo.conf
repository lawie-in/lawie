events {
  worker_connections 256;
}

http {
  upstream gateway { server gateway:4000; }

  # Shared proxy settings
  proxy_http_version  1.1;
  proxy_set_header    Host              $host;
  proxy_set_header    X-Real-IP         $remote_addr;
  proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header    X-Forwarded-Proto $scheme;
  proxy_set_header    Upgrade           $http_upgrade;
  proxy_set_header    Connection        "upgrade";
  proxy_read_timeout  120s;
  proxy_connect_timeout 10s;
  client_max_body_size 10m;

  # ── HTTP — redirect to HTTPS + certbot renewal ─────────────────────────────
  server {
    listen 80;
    server_name demo.lawie.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name demo.lawie.in;

    ssl_certificate     /etc/letsencrypt/live/demo.lawie.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.lawie.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    client_max_body_size 10m;

    location / {
      proxy_pass http://gateway;
    }
  }
}
