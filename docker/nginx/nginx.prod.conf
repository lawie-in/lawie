events {
  worker_connections 1024;
}

http {
  # ── Upstream service blocks ──────────────────────────────────────────────────
  upstream gateway  { server gateway:4000; }
  upstream auth     { server auth:4001; }
  upstream drafting { server drafting:4002; }
  upstream billing  { server billing:4003; }

  # ── Shared proxy headers (included in every location) ───────────────────────
  proxy_http_version  1.1;
  proxy_set_header    Host              $host;
  proxy_set_header    X-Real-IP         $remote_addr;
  proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header    X-Forwarded-Proto $scheme;
  proxy_read_timeout  60s;
  proxy_connect_timeout 10s;

  # ── Access log without one-time tokens (T-377) ──────────────────────────────
  # The verification link, the web /auth/callback and the API's Google callback
  # (/api/auth/google/callback, proxied to auth) carry a one-time token or a single-use Google
  # code in the query; the log keeps the hit but hides the query.
  map $request_uri $lawie_log_uri {
    ~^(?<p>/(?:verify-email|(?:api/)?auth/(?:google/)?callback))/?\?.*$  "$p?[stripped]";
    default                                          $request_uri;
  }
  log_format lawie_noquery '$remote_addr - $remote_user [$time_local] '
                           '"$request_method $lawie_log_uri $server_protocol" '
                           '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

  # ── HTTP — redirect to HTTPS + serve certbot ACME challenge ─────────────────
  server {
    listen 80;
    server_name api.lawie.com;
    access_log /var/log/nginx/access.log lawie_noquery;

    # Certbot renewal webroot challenge — must stay on HTTP
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS ────────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name api.lawie.com;
    access_log /var/log/nginx/access.log lawie_noquery;

    # Let's Encrypt certs — provisioned by certbot on EC2 host, mounted read-only
    ssl_certificate     /etc/letsencrypt/live/api.lawie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.lawie.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Client request limits
    client_max_body_size 10m;

    # ── Auth service ─────────────────────────────────────────────────────────
    # /api/auth/register → http://auth:4001/register (trailing slash strips prefix)
    location /api/auth/ {
      proxy_pass http://auth/;
    }

    # ── Drafting service ──────────────────────────────────────────────────────
    # /api/documents/... → http://drafting:4002/...
    location /api/documents/ {
      proxy_pass http://drafting/;
    }

    # ── Billing service ───────────────────────────────────────────────────────
    # /api/billing/... → http://billing:4003/...
    location /api/billing/ {
      proxy_pass http://billing/;
    }

    # ── Gateway — catch-all ───────────────────────────────────────────────────
    location / {
      proxy_pass http://gateway/;
    }
  }
}
